services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_de
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_de"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "${DEMO_POSTGRES_PORT:-15433}:5432"
    volumes:
      - ./infra/demo-dbs/postgres:/docker-entrypoint-initdb.d:ro
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: analytics
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DEMO_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./infra/demo-dbs/mysql:/docker-entrypoint-initdb.d:ro
      - demo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u demo -pdemo"]
      interval: 10s
      timeout: 5s
      retries: 10

  demo-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${DEMO_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${DEMO_CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - ./infra/demo-dbs/clickhouse:/docker-entrypoint-initdb.d:ro
      - demo-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "demo", "--password", "demo", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  demo-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: analytics
    ports:
      - "${DEMO_MONGO_PORT:-27018}:27017"
    volumes:
      - ./infra/demo-dbs/mongo:/docker-entrypoint-initdb.d:ro
      - demo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  demo-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "demo"]
    ports:
      - "${DEMO_REDIS_PORT:-16379}:6379"
    volumes:
      - demo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "demo", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  demo-redis-seed:
    image: redis:7-alpine
    depends_on:
      demo-redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        redis-cli -h demo-redis -a demo SET feature:checkout_conversion 0.184
        redis-cli -h demo-redis -a demo HSET realtime:orders today 1280 paid 1179 cancelled 101
        redis-cli -h demo-redis -a demo SADD active_segments retail b2b vip
        redis-cli -h demo-redis -a demo LPUSH recent_events checkout search add_to_cart page_view

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_de
      JWT_SECRET: local-dev-secret
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}","http://localhost:3000","http://127.0.0.1:3000","http://localhost:3002","http://127.0.0.1:3002"]'
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_PUBLIC_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_STATUS_URL: http://spark-master:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-magnitgpt}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      MAGNITGPT_API_KEY: ${MAGNITGPT_API_KEY:-}
      MAGNITGPT_MODEL: ${MAGNITGPT_MODEL:-MagnitGPT}
      MAGNITGPT_BASE_URL: ${MAGNITGPT_BASE_URL:-https://llmlite.ai.corp.tander.ru/v1}
      MAGNITGPT_VERIFY_SSL: ${MAGNITGPT_VERIFY_SSL:-true}
      MAGNITGPT_TIMEOUT_SECONDS: ${MAGNITGPT_TIMEOUT_SECONDS:-120}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      ARTIFACT_ROOT: /workspace/infra
      ARTIFACT_GIT_ENABLED: ${ARTIFACT_GIT_ENABLED:-true}
      ARTIFACT_GIT_ROOT: /workspace/infra
      AGENT_DEBUGGER_URL: http://agent-debugger:8090
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_NPX_COMMAND: ${MCP_NPX_COMMAND:-npx}
      MCP_UVX_COMMAND: ${MCP_UVX_COMMAND:-uvx}
      MCP_DATABASE_URL: ${MCP_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_de}
      MCP_SPARK_MASTER: ${MCP_SPARK_MASTER:-local[*]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./infra:/workspace/infra
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.4
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-airflow-secret
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: version

  airflow-webserver:
    image: apache/airflow:2.10.4
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-airflow-secret
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./infra/spark/jobs:/opt/airflow/jobs
      - airflow-logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.4
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-airflow-secret
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./infra/spark/jobs:/opt/airflow/jobs
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  spark-master:
    image: apache/spark:3.5.4
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"
    volumes:
      - ./infra/spark/jobs:/opt/spark/jobs

  spark-worker:
    image: apache/spark:3.5.4
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    volumes:
      - ./infra/spark/jobs:/opt/spark/jobs

  agent-debugger:
    build:
      context: ./infra/debugger
    profiles:
      - debug
    environment:
      SANDBOX_CONTAINER_RUNS_DIR: /sandbox-runs
      SANDBOX_HOST_RUNS_DIR: ${SANDBOX_HOST_RUNS_DIR:-/tmp/ai-de-sandbox-runs}
      SANDBOX_PYTHON_IMAGE: python:3.12-slim
      SANDBOX_AIRFLOW_IMAGE: apache/airflow:2.10.4
      SANDBOX_SPARK_IMAGE: apache/spark:3.5.4
    ports:
      - "${AGENT_DEBUGGER_PORT:-8090}:8090"
    volumes:
      - ./infra:/workspace/infra:ro
      - ${SANDBOX_HOST_RUNS_DIR:-/tmp/ai-de-sandbox-runs}:/sandbox-runs
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  demo-postgres-data:
  demo-mysql-data:
  demo-clickhouse-data:
  demo-mongo-data:
  demo-redis-data:
  airflow-postgres-data:
  airflow-logs:
